  # ─── Import / Export ────────────────────────────────────────────────
  /export/dump:
    get:
      tags: [ImportExport]
      operationId: getDumpExport
      summary: Export the full database state as a backup bundle
      description: |
        Returns a ZIP bundle containing a PostgreSQL custom-format data dump and a
        `metadata.json` file with schema version, an optional comment, and creation
        timestamp. The bundle is also stored on the server and listed via
        `GET /backups`, so this endpoint both downloads and creates a backup.
      parameters:
        - name: comment
          in: query
          required: false
          description: Optional free-text comment stored in the backup metadata.
          schema:
            type: string
      responses:
        "200":
          description: Backup bundle (ZIP)
          headers:
            Content-Disposition:
              description: File attachment header with timestamped filename (`attachment; filename="2025-04-29_14-30-00.stdp"`).
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "500":
          description: Internal server error

  /import/dump:
    post:
      tags: [ImportExport]
      operationId: postDumpImport
      summary: Import a previously exported backup bundle
      description: |
        Replaces the current database state with the contents of the uploaded
        backup bundle. The upload can be produced by `GET /export/dump`.
        The dump is restored into a fresh schema matching its `schemaVersion`
        and then migrated to the current schema version; if the restore or
        migration fails, the previous database state is rolled back.
        All existing data is replaced, only authorized users are preserved.
        While the import is running, all other requests are answered with 503.
        Maximum upload size is 15 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP backup bundle as produced by `GET /export/dump`
      responses:
        "200":
          description: Import completed successfully
        "400":
          description: Request was not multipart, or the bundle could not be parsed
        "500":
          description: Internal server error

  /backups:
    get:
      tags: [ImportExport]
      operationId: listBackups
      summary: List all stored backups
      description: |
        Returns metadata for every backup currently stored on the server. Each
        entry references the backup file by its ID, which can be used to restore them.
        Returns an empty array if no backups exist.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupIndexEntry"
        "500":
          description: Internal server error

  /backups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Backup identifier (16-character hex string from the backup index)
        schema:
          type: string
    get:
      tags: [ImportExport]
      operationId: getBackup
      summary: Download a stored backup bundle
      description: Returns the ZIP bundle of a previously created backup.
      responses:
        "200":
          description: Backup bundle
          headers:
            Content-Disposition:
              description: File attachment header with the backup's timestamped filename (`attachment; filename="2025-04-29_14-30-00.stdp"`).
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No backup with the given ID exists
        "500":
          description: Internal server error
    delete:
      tags: [ImportExport]
      operationId: deleteBackup
      summary: Delete a stored backup
      description: Removes the backup ZIP file and its index entry.
      responses:
        "200":
          description: Backup deleted successfully
        "404":
          description: No backup with the given ID exists
        "500":
          description: Internal server error

  /backups/restore/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Backup identifier (16-character hex string from the backup index)
        schema:
          type: string
    post:
      tags: [ImportExport]
      operationId: postBackupRestore
      summary: Restore a stored backup
      description: |
        Restores the database state from a backup that is already stored on the
        server (no upload needed). The dump is restored into a fresh schema
        matching its `schemaVersion` and then migrated to the current schema
        version; if the restore or migration fails, the previous database state
        is rolled back.
        While the restore is running, all other requests are answered with 503.
      responses:
        "200":
          description: Restore completed successfully
        "404":
          description: No backup with the given ID exists
        "500":
          description: Internal server error

  /truncate:
    post:
      tags: [ImportExport]
      operationId: postTruncate
      summary: Truncate the database after creating a backup
      description: |
        Creates a backup first (identical to `GET /export/dump`, it is stored
        on the server and listed via `GET /backups`), then truncates all tables
        except authorized users and returns the backup bundle as a download.
        If the backup creation fails, the database is NOT truncated and 500 is
        returned.
        While the operation is running, all other requests are answered with 503.
      parameters:
        - name: comment
          in: query
          required: false
          description: |
            Optional free-text comment stored in the backup metadata. If omitted,
            a default comment marking the backup as an automatic pre-truncate
            backup is used.
          schema:
            type: string
      responses:
        "200":
          description: Database truncated, backup bundle (ZIP) is returned
          headers:
            Content-Disposition:
              description: File attachment header with timestamped filename (`attachment; filename="2025-04-29_14-30-00.stdp"`).
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "500":
          description: Internal server error (the database is only truncated if the backup succeeded)

  # ─── CSV / XLSX Import / Export ───────────────────────────────────────
  /import/csv:
    post:
      tags: [ImportExport]
      operationId: postCSVImport
      summary: Import resources from a CSV or XLSX file
      description: |
        Imports resources from a CSV or XLSX file. The file format is detected automatically.

        The resource type is detected automatically from the header row
        (see documentation). Supported resource types are: lecturer, room,
        degree_program, study_group, and course.

        All rows are validated and inserted in a single transaction, that is rolled back in case an error occurs.
        Maximum upload size is 15 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or XLSX file with a header row matching one of the supported resource types
      responses:
        "200":
          description: Import completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSVImportSuccess"
        "400":
          description: Request was not multipart, could not be parsed, or file type is not CSV/XLSX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSVImportError"
        "422":
          description: Validation or constraint error during import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSVImportError"
        "500":
          description: Internal server error

  /import/xlsx:
    post:
      tags: [ImportExport]
      operationId: postXLSXImport
      summary: Import resources from a CSV or XLSX file
      description: |
        Alias for `POST /import/csv` (backwards compatibility). Accepts both CSV and XLSX files,
        identical behavior. See `POST /import/csv` for full documentation.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or XLSX file with a header row matching one of the supported resource types
      responses:
        "200":
          description: Import completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSVImportSuccess"
        "400":
          description: Request was not multipart, could not be parsed, or file type is not CSV/XLSX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSVImportError"
        "422":
          description: Validation or constraint error during import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSVImportError"
        "500":
          description: Internal server error

  /export/csv/{resource}:
    parameters:
      - name: resource
        in: path
        required: true
        description: The resource type to export
        schema:
          $ref: "#/components/schemas/CSVResourceType"
    get:
      tags: [ImportExport]
      operationId: getCSVExport
      summary: Export resources as a CSV file
      description: |
        Exports all entries of the specified resource type as a CSV file.
        The response includes a `Content-Disposition` header for file download.
      responses:
        "200":
          description: CSV file download
          headers:
            Content-Disposition:
              description: File attachment header (`attachment; filename="export.csv"`)
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid resource type in path parameter
        "500":
          description: Internal server error

  /export/xlsx/{resource}:
    parameters:
      - name: resource
        in: path
        required: true
        description: The resource type to export
        schema:
          $ref: "#/components/schemas/CSVResourceType"
    get:
      tags: [ImportExport]
      operationId: getXLSXExport
      summary: Export resources as an XLSX file
      description: |
        Exports all entries of the specified resource type as an XLSX file.
        The response includes a `Content-Disposition` header for file download.
      responses:
        "200":
          description: XLSX file download
          headers:
            Content-Disposition:
              description: File attachment header (`attachment; filename="export.xlsx"`)
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid resource type in path parameter
        "500":
          description: Internal server error

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Unique resource identifier
      schema:
        type: integer

    CourseId:
      name: course_id
      in: path
      required: true
      description: Course ID
      schema:
        type: integer

    StudyGroupTemplateId:
      name: study_group_template_id
      in: path
      required: true
      description: Study Group Template ID
      schema:
        type: integer

    LecturerId:
      name: lecturer_id
      in: path
      required: true
      description: Lecturer ID
      schema:
        type: integer

    TimeSlotId:
      name: time_slot_id
      in: path
      required: true
      description: Course time slot ID
      schema:
        type: integer

    RoomId:
      name: room_id
      in: path
      required: true
      description: Room ID
      schema:
        type: integer

  schemas:
    # ─── Room ─────────────────────────────────────────────────────────────
    Room:
      type: object
      description: A room / lab / lecture hall
      required: [id]
      properties:
        id:
          type: integer
          description: Unique room identifier
          examples: [1]
        number:
          type: string
          description: Room number
          examples: ["5.205"]
        name:
          type: string
          description: Room name
          examples: ["Cooler Raum"]
        seats:
          type: integer
          description: Number of seats in the room
          examples: [30]

    RoomCreate:
      type: object
      description: Request body for creating a new room.
      required: [number]
      properties:
        number:
          type: string
          description: Room number
          examples: ["5.202"]
        name:
          type: ["string", "null"]
          description: Room name
          examples: ["Cooler Raum"]
        seats:
          type: ["integer", "null"]
          description: Number of seats in the room
          examples: [30]

    RoomUpdate:
      type: object
      description: Request body for updating a room. All fields are optional (PATCH semantics).
      properties:
        number:
          type: ["string", "null"]
          description: Room number
        name:
          type: ["string", "null"]
          description: Room name
        seats:
          type: ["integer", "null"]
          description: Number of seats in the room

    # ─── Lecturer ─────────────────────────────────────────────────────────
    Lecturer:
      type: object
      description: |
        A lecturer or teaching staff member.
      required: [id]
      properties:
        id:
          type: integer
          description: Unique lecturer identifier
          examples: [1]
        first_name:
          type: string
          description: Lecturer's first name
          examples: ["Max"]
        last_name:
          type: string
          description: Lecturer's last name
          examples: ["Mustermann"]
        abbreviation:
          type: string
          description: |
            Lecturer's abbreviation/short code.
          examples: ["???"]
        kind:
          $ref: "#/components/schemas/LecturerKind"
        notes:
          type: string
          description: Additional notes about the lecturer
          examples: ["Mag ich nicht"]
        is_relevant:
          type: boolean
          description: Soft deletion flag
          examples: [true]

    LecturerCreate:
      type: object
      description: |
        Request body for creating a new lecturer.
        If `is_relevant` is not provided, it defaults to `true`.
        Returns 400 Bad Request if `kind` is not one of the allowed values.
      required: [first_name, last_name, abbreviation, kind]
      properties:
        first_name:
          type: string
          description: Lecturer's first name
          examples: ["Max"]
        last_name:
          type: string
          description: Lecturer's last name
          examples: ["Mustermann"]
        abbreviation:
          type: string
          description: Lecturer's abbreviation/short code
          examples: ["???"]
        kind:
          $ref: "#/components/schemas/LecturerKind"
        notes:
          type: ["string", "null"]
          description: Additional notes about the lecturer
        is_relevant:
          type: ["boolean", "null"]
          description: Soft deletion flag

    LecturerUpdate:
      type: object
      description: Request body for updating a lecturer. All fields are optional (PATCH semantics).
      properties:
        first_name:
          type: ["string", "null"]
          description: Lecturer's first name
        last_name:
          type: ["string", "null"]
          description: Lecturer's last name
        abbreviation:
          type: ["string", "null"]
          description: Lecturer's abbreviation/short code
        kind:
          $ref: "#/components/schemas/LecturerKind"
        notes:
          type: ["string", "null"]
          description: Additional notes about the lecturer
        is_relevant:
          type: ["boolean", "null"]
          description: Soft deletion flag

    # ─── Course ───────────────────────────────────────────────────────────
    Course:
      type: object
      description: A course
      required: [id]
      properties:
        id:
          type: integer
          description: Unique course identifier
          examples: [1]
        number:
          type: string
          description: Official course number
          examples: ["1337"]
        name:
          type: string
          description: Course name
          examples: ["Einführung in API Dokumentation"]
        sws:
          type: integer
          description: Semester hours per week (Semesterwochenstunden)
          examples: [6]
        credit_points:
          type: integer
          description: Credit points for the course
          examples: [5]
        abbreviation:
          type: string
          description: Course abbreviation
          examples: ["EAD"]

    CourseCreate:
      type: object
      description: Request body for creating a new course.
      required: [number, name, abbreviation]
      properties:
        number:
          type: string
          description: Official course number
          examples: ["1337"]
        name:
          type: string
          description: Course name
          examples: ["Einführung in API Dokumentation"]
        sws:
          type: ["integer", "null"]
          description: Semester hours per week (Semesterwochenstunden)
          examples: [6]
        credit_points:
          type: ["integer", "null"]
          description: Credit points for the course
          examples: [5]
        abbreviation:
          type: string
          description: Course abbreviation
          examples: ["EAD"]

    CourseUpdate:
      type: object
      description: Request body for updating a course. All fields are optional (PATCH semantics).
      properties:
        number:
          type: ["string", "null"]
          description: Official course number
        name:
          type: ["string", "null"]
          description: Course name
        sws:
          type: ["integer", "null"]
          description: Semester hours per week
        credit_points:
          type: ["integer", "null"]
          description: Credit points
        abbreviation:
          type: ["string", "null"]
          description: Course abbreviation

    # ─── Degree Program ───────────────────────────────────────────────────
    DegreeProgram:
      type: object
      description: A degree program (Studiengang) such as Informatik
      required: [id]
      properties:
        id:
          type: integer
          description: Unique degree program identifier
          examples: [1]
        name:
          type: string
          description: Degree program name (must be unique)
          examples: ["Informatik B.Sc."]
        abbreviation:
          type: string
          description: Degree program abbreviation
          examples: ["INF"]

    DegreeProgramCreate:
      type: object
      description: Request body for creating a new degree program.
      required: [name, abbreviation]
      properties:
        name:
          type: string
          description: Degree program name (must be unique)
          examples: ["Informatik B.Sc."]
        abbreviation:
          type: string
          description: Degree program abbreviation
          examples: ["INF"]

    DegreeProgramUpdate:
      type: object
      description: Request body for updating a degree program. All fields are optional (PATCH semantics).
      properties:
        name:
          type: ["string", "null"]
          description: Degree program name
        abbreviation:
          type: ["string", "null"]
          description: Degree program abbreviation

    # ─── Study Group ──────────────────────────────────────────────────────
    StudyGroup:
      type: object
      description: |
        A study group represents a cohort of students in a specific semester
        within a degree program.
      required: [id]
      properties:
        id:
          type: integer
          description: Unique study group identifier
          examples: [1]
        semester_season:
          $ref: "#/components/schemas/SemesterSeason"
        semester_year:
          type: integer
          description: Year of the semester
          examples: [2025]
        student_count:
          type: integer
          description: Number of students in the group
          examples: [30]
        degree_program:
          type: integer
          description: ID of the associated degree program (foreign key)
          examples: [1]

    StudyGroupCreate:
      type: object
      description: Request body for creating a new study group. All fields are required.
      required: [semester_season, semester_year, student_count, degree_program]
      properties:
        semester_season:
          $ref: "#/components/schemas/SemesterSeason"
        semester_year:
          type: integer
          description: Year of the semester
          examples: [2025]
        student_count:
          type: integer
          description: Number of students in the group
          examples: [30]
        degree_program:
          type: integer
          description: ID of the associated degree program (must exist)
          examples: [1]
        templates:
          type: array
          items:
            type: integer
          description: IDs of the study group templates to apply
          examples: [[1, 2]]

    StudyGroupUpdate:
      type: object
      description: |
        Request body for updating a study group. All fields are optional (PATCH semantics).
      properties:
        semester_season:
          oneOf:
            - $ref: "#/components/schemas/SemesterSeason"
            - type: "null"
        semester_year:
          type: ["integer", "null"]
          description: Year of the semester
        student_count:
          type: ["integer", "null"]
          description: Number of students in the group
        degree_program:
          type: ["integer", "null"]
          description: ID of the associated degree program

    # ─── Study Group Template ─────────────────────────────────────────────
    StudyGroupTemplate:
      type: object
      description: |
        A study group template represents a template for creating study groups
      required: [id]
      properties:
        id:
          type: integer
          description: Unique study group template identifier
          examples: [1]
        name:
          type: string
          description: Human-readable study group template name
          examples: ["INF-Template"]

    StudyGroupTemplateCreate:
      type: object
      description: Request body for creating a new study group template. All fields are required.
      required: [name]
      properties:
        name:
          type: string
          description: Human-readable study group template name
          examples: ["INF-Template"]

    StudyGroupTemplateUpdate:
      type: object
      description: |
        Request body for updating a study group. All fields are optional (PATCH semantics).
      properties:
        name:
          type: string
          description: Human-readable study group template name
          examples: ["INF-Template"]

    StudyGroupTemplateCourse:
      type: object
      required: [template, course]
      properties:
        template:
          type: integer
        course:
          type: integer

    # ─── Course Time Slot ─────────────────────────────────────────────────
    CourseTimeSlot:
      type: object
      description: |
        A scheduled time slot for a course, specifying the day of week, start time, and duration.
      required: [id]
      properties:
        id:
          type: integer
          description: Unique time slot identifier
          examples: [1]
        course:
          type: integer
          description: ID of the associated course (foreign key)
          examples: [1]
        weekday:
          type: integer
          description: Day of the week (0 = Sunday, 1 = Monday, ..., 6 = Saturday)
          minimum: 0
          maximum: 6
          examples: [1]
        at:
          type: string
          description: Start time of the slot (HH:MM or other formats accepted by PostgreSQL)
          examples: ["08:00"]
        duration:
          type: string
          description: Duration of the slot (Value with unit suffix or other formats accepted by PostgreSQL)
          examples: ["1h"]
        one_off_date:
          type: string
          description: The optional one off date of this time slot
          examples: ["2026-06-10"]

    CourseTimeSlotCreate:
      type: object
      description: Request body for creating a new course time slot. All fields are required.
      required: [course, weekday, at, duration]
      properties:
        course:
          type: integer
          description: ID of the associated course (must exist)
          examples: [1]
        weekday:
          type: integer
          description: Day of the week (0 = Sunday, ..., 6 = Saturday)
          minimum: 0
          maximum: 6
          examples: [1]
        at:
          type: string
          description: Start time of the slot
          examples: ["08:00"]
        duration:
          type: string
          description: Duration of the slot
          examples: ["1h"]
        one_off_date:
          type: string
          description: The optional one off date of this time slot
          examples: ["2026-06-10"]

    CourseTimeSlotUpdate:
      type: object
      description: |
        Request body for updating a course time slot. All fields are optional (PATCH semantics).
        If `weekday` is provided, it must be between 0 and 6.
        If `course` is provided, the referenced course must exist.
      properties:
        course:
          type: ["integer", "null"]
          description: ID of the associated course
        weekday:
          type: ["integer", "null"]
          description: Day of the week (0-6)
          minimum: 0
          maximum: 6
        at:
          type: ["string", "null"]
          description: Start time of the slot
        duration:
          type: ["string", "null"]
          description: Duration of the slot
        one_off_date:
          type: string
          description: The optional one off date of this time slot
          examples: ["2026-06-10"]

    # ─── Course Color ─────────────────────────────────────────────────────
    CourseColor:
      type: object
      description: A color definition that can be assigned to courses for visual display.
      required: [id]
      properties:
        id:
          type: integer
          description: Unique color identifier
          examples: [1]
        name:
          type: string
          description: Human-readable color name
          examples: ["Blue"]
        hex:
          type: string
          description: Hex color code in `#RRGGBB` format
          pattern: "^#[A-Fa-f0-9]{6}$"
          examples: ["#FAFAFA"]

    CourseColorCreate:
      type: object
      description: Request body for creating a new course color.
      required: [name, hex]
      properties:
        name:
          type: string
          description: Human-readable color name or meaning
          examples: ["Externer Dozent"]
        hex:
          type: string
          description: Hex color code in `#RRGGBB` format
          pattern: "^#[A-Fa-f0-9]{6}$"
          examples: ["#FAFAFA"]

    CourseColorUpdate:
      type: object
      description: |
        Request body for updating a course color. All fields are optional (PATCH semantics).
        If `hex` is provided, it must match the pattern `#RRGGBB`.
      properties:
        name:
          type: ["string", "null"]
          description: Human-readable color name
        hex:
          type: ["string", "null"]
          description: Hex color code in `#RRGGBB` format
          pattern: "^#[A-Fa-f0-9]{6}$"

    # ─── Lecturer Negative Time Constraint ────────────────────────────────
    LecturerNegativeTimeConstraint:
      type: object
      description: |
        A time constraint indicating when a lecturer is NOT available for scheduling.
        Can be marked as "soft" (preference) or "hard" (absolute unavailability).
      required: [id]
      properties:
        id:
          type: integer
          description: Unique constraint identifier
          examples: [1]
        lecturer:
          type: integer
          description: ID of the associated lecturer (foreign key)
          examples: [1]
        weekday:
          type: integer
          description: Day of the week (0 = Sunday, ..., 6 = Saturday)
          minimum: 0
          maximum: 6
          examples: [3]
        at:
          type: string
          description: Start time of the unavailable period (HH:MM or other formats accepted by PostgreSQL)
          examples: ["15:00"]
        duration:
          type: string
          description: Duration of the unavailable period (Value and unit suffix or other formats accepted by PostgreSQL)
          examples: ["3h"]
        soft:
          type: boolean
          description: |
            Distinction between soft constraints (preference) and hard constraints (requirement)
          examples: [false]

    LecturerNegativeTimeConstraintCreate:
      type: object
      description: Request body for creating a new lecturer negative time constraint. All fields are required.
      required: [lecturer, weekday, at, duration, soft]
      properties:
        lecturer:
          type: integer
          description: ID of the associated lecturer (must exist)
          examples: [1]
        weekday:
          type: integer
          description: Day of the week (0-6)
          minimum: 0
          maximum: 6
          examples: [3]
        at:
          type: string
          description: Start time of the unavailable period (HH:MM or other formats accepted by PostgreSQL)
          examples: ["14:00"]
        duration:
          type: string
          description: Duration of the unavailable period (Value and unit suffix or other formats accepted by PostgreSQL)
          examples: ["3h"]
        soft:
          type: boolean
          description: Whether this is a soft or hard constraint
          examples: [false]

    LecturerNegativeTimeConstraintUpdate:
      type: object
      description: |
        Request body for updating a lecturer negative time constraint.
        All fields are optional (PATCH semantics).
      properties:
        lecturer:
          type: ["integer", "null"]
          description: ID of the associated lecturer
        weekday:
          type: ["integer", "null"]
          description: Day of the week (0-6)
          minimum: 0
          maximum: 6
          examples: [3]
        at:
          type: ["string", "null"]
          description: Start time of the unavailable period
        duration:
          type: ["string", "null"]
          description: Duration of the unavailable period
        soft:
          type: ["boolean", "null"]
          description: Whether this is a soft or hard constraint

    # ─── Time Slot Room Assignment ─────────────────────────────────────────
    TimeSlotRoomAssignment:
      type: object
      description: An assignment linking a course time slot to a room.
      required: [time_slot, room]
      properties:
        time_slot:
          type: integer
          description: ID of the course time slot (foreign key)
          examples: [1]
        room:
          type: integer
          description: ID of the room (foreign key)
          examples: [2]

    # ─── Junction Types (for GlobalGalaktisch) ────────────────────────────
    CourseColorAssignment:
      type: object
      required: [course, color]
      properties:
        course:
          type: integer
        color:
          type: integer

    CourseLecturer:
      type: object
      required: [course, lecturer]
      properties:
        course:
          type: integer
        lecturer:
          type: integer

    CourseStudyGroup:
      type: object
      required: [course, study_group]
      properties:
        course:
          type: integer
        study_group:
          type: integer

    # ─── Global Galaktisch ───────────────────────────────────────────────
    GlobalGalaktisch:
      type: object
      description: Aggregated response containing all resources in a single request.
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        course_colors:
          type: array
          items:
            $ref: "#/components/schemas/CourseColor"
        course_color_assignments:
          type: array
          items:
            $ref: "#/components/schemas/CourseColorAssignment"
        course_lecturers:
          type: array
          items:
            $ref: "#/components/schemas/CourseLecturer"
        course_study_groups:
          type: array
          items:
            $ref: "#/components/schemas/CourseStudyGroup"
        course_time_slots:
          type: array
          items:
            $ref: "#/components/schemas/CourseTimeSlot"
        degree_programs:
          type: array
          items:
            $ref: "#/components/schemas/DegreeProgram"
        lecturers:
          type: array
          items:
            $ref: "#/components/schemas/Lecturer"
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/Room"
        study_groups:
          type: array
          items:
            $ref: "#/components/schemas/StudyGroup"
        study_groups_templates:
          type: array
          items:
            $ref: "#/components/schemas/StudyGroupTemplate"
        study_groups_template_courses:
          type: array
          items:
            $ref: "#/components/schemas/StudyGroupTemplateCourse"
        time_constraints:
          type: array
          items:
            $ref: "#/components/schemas/LecturerNegativeTimeConstraint"
        time_slot_room_assignments:
          type: array
          items:
            $ref: "#/components/schemas/TimeSlotRoomAssignment"

    # ─── Resource Conflict ──────────────────────────────────────────────
    ResourceConflict:
      type: object
      description: |
        A scheduling conflict between two time slots that share the same resource
        (room, lecturer, or study group) on the same day with overlapping times.
      required: [resource_type, resource_id, weekday, slot_a_id, slot_a_course, slot_a_at, slot_a_duration, slot_b_id, slot_b_course, slot_b_at, slot_b_duration]
      properties:
        resource_type:
          type: string
          enum: [room, lecturer, study_group]
          description: The type of resource that is double-booked
          examples: ["room"]
        resource_id:
          type: integer
          description: ID of the double-booked resource (references a room, lecturer, or study group depending on `resource_type`)
          examples: [1]
        weekday:
          type: integer
          description: Day of the week on which the conflict occurs (0 = Monday, ..., 6 = Sunday)
          minimum: 0
          maximum: 6
          examples: [0]
        slot_a_id:
          type: integer
          description: ID of the first conflicting time slot
          examples: [1]
        slot_a_course:
          type: integer
          description: Course ID of the first conflicting time slot
          examples: [1]
        slot_a_at:
          type: string
          description: Start time of the first conflicting time slot
          examples: ["08:00:00+00"]
        slot_a_duration:
          type: string
          description: Duration of the first conflicting time slot
          examples: ["01:30:00"]
        slot_b_id:
          type: integer
          description: ID of the second conflicting time slot
          examples: [2]
        slot_b_course:
          type: integer
          description: Course ID of the second conflicting time slot
          examples: [2]
        slot_b_at:
          type: string
          description: Start time of the second conflicting time slot
          examples: ["09:00:00+00"]
        slot_b_duration:
          type: string
          description: Duration of the second conflicting time slot
          examples: ["01:30:00"]

    IgnoreResourceConflictRequest:
      type: object
      description: |
        Request body for ignoring or un-ignoring a resource conflict. Identifies
        a conflict by its pair of time slots and the affected resource.
      required: [slot_a_id, slot_b_id, resource_type, resource_id]
      properties:
        slot_a_id:
          type: integer
          description: ID of the first conflicting time slot
          examples: [1]
        slot_b_id:
          type: integer
          description: ID of the second conflicting time slot
          examples: [2]
        resource_type:
          type: string
          enum: [room, lecturer, study_group]
          description: Type of the double-booked resource
          examples: ["room"]
        resource_id:
          type: integer
          description: ID of the double-booked resource
          examples: [1]

    IgnoredResourceConflict:
      type: object
      description: A resource conflict that has been marked as ignored.
      required: [slot_a, slot_b, resource_type, resource_id]
      properties:
        slot_a:
          type: integer
          description: ID of the first conflicting time slot
          examples: [1]
        slot_b:
          type: integer
          description: ID of the second conflicting time slot
          examples: [2]
        resource_type:
          type: string
          enum: [room, lecturer, study_group]
          description: Type of the double-booked resource
          examples: ["room"]
        resource_id:
          type: integer
          description: ID of the double-booked resource
          examples: [1]

    RelatedConstraintViolations:
      type: object
      description: |
        Combined response containing both resource conflicts and lecturer time
        constraint violations that are related to a given study group.
      required: [resource_conflicts, lecturer_time_constraint_violations]
      properties:
        resource_conflicts:
          type: array
          items:
            $ref: "#/components/schemas/ResourceConflict"
        lecturer_time_constraint_violations:
          type: array
          items:
            $ref: "#/components/schemas/LecturerTimeConstraintViolation"

    # ─── Lecturer Time Constraint Violation ────────────────────────────
    LecturerTimeConstraintViolation:
      type: object
      description: |
        A violation where a lecturer is scheduled in a time slot that overlaps with
        one of their negative time constraints.
      required: [constraint_id, lecturer_id, soft, weekday, constraint_at, constraint_duration, time_slot_id, course_id, slot_at, slot_duration]
      properties:
        constraint_id:
          type: integer
          description: ID of the violated negative time constraint
          examples: [1]
        lecturer_id:
          type: integer
          description: ID of the affected lecturer
          examples: [1]
        soft:
          type: boolean
          description: Whether the violated constraint is a soft constraint (preference) or hard constraint (requirement)
          examples: [false]
        weekday:
          type: integer
          description: Day of the week on which the violation occurs (0 = Monday, ..., 6 = Sunday)
          minimum: 0
          maximum: 6
          examples: [3]
        constraint_at:
          type: string
          description: Start time of the unavailability window defined by the constraint
          examples: ["14:00:00+00"]
        constraint_duration:
          type: string
          description: Duration of the unavailability window defined by the constraint
          examples: ["03:00:00"]
        time_slot_id:
          type: integer
          description: ID of the time slot that violates the constraint
          examples: [5]
        course_id:
          type: integer
          description: ID of the course scheduled in the violating time slot
          examples: [2]
        slot_at:
          type: string
          description: Start time of the violating time slot
          examples: ["15:00:00+00"]
        slot_duration:
          type: string
          description: Duration of the violating time slot
          examples: ["01:30:00"]

    IgnoreLecturerConstraintViolationRequest:
      type: object
      description: |
        Request body for ignoring or un-ignoring a lecturer time constraint
        violation. Identifies the violation by its (constraint, time slot) pair.
      required: [constraint_id, time_slot_id]
      properties:
        constraint_id:
          type: integer
          description: ID of the violated negative time constraint
          examples: [1]
        time_slot_id:
          type: integer
          description: ID of the time slot that violates the constraint
          examples: [5]

    IgnoredLecturerConstraintViolation:
      type: object
      description: A lecturer time constraint violation that has been marked as ignored.
      required: [constraint_id, time_slot_id]
      properties:
        constraint_id:
          type: integer
          description: ID of the ignored negative time constraint
          examples: [1]
        time_slot_id:
          type: integer
          description: ID of the time slot whose violation is ignored
          examples: [5]

    # ─── Import / Export ─────────────────────────────────────────────────
    BackupIndexEntry:
      type: object
      description: Metadata for a single stored backup, as listed by `GET /backups`.
      required: [id, filename, schemaVersion, comment, createdAt]
      properties:
        id:
          type: string
          description: 16-character hex identifier of the backup
          examples: ["a1b2c3d4e5f60718"]
        filename:
          type: string
          description: Original timestamped filename
          examples: ["2025-04-29_14-30-00.stdp"]
        schemaVersion:
          type: integer
          description: Database schema version at the time the backup was created
          examples: [3]
        comment:
          type: string
          description: Optional free-text comment supplied via the `comment` query parameter at export time (empty string if none)
          examples: ["Pre-migration snapshot"]
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp at which the backup was created
          examples: ["2025-04-29T14:30:00Z"]

    # ─── CSV Import / Export ─────────────────────────────────────────────
    CSVImportSuccess:
      type: object
      description: Successful CSV import response.
      required: [imported_entries]
      properties:
        imported_entries:
          type: integer
          description: Number of rows successfully imported (empty rows are excluded)
          examples: [42]

    CSVImportError:
      type: object
      description: |
        Error response returned when a CSV import fails validation or
        violates a database constraint. The `line_nr` indicates the
        CSV row that caused the error (1-based including header).
      required: [line_nr, err_type, message]
      properties:
        line_nr:
          type: integer
          description: Line number in the CSV file where the error occurred. 0 for global errors.
          examples: [5]
        err_type:
          $ref: "#/components/schemas/CSVImportErrorType"
        message:
          type: string
          description: Human-readable english error message
          examples: ["required field 'nachname' is empty"]

    CSVImportErrorType:
      type: string
      description: |
        Classification of a CSV/XLSX import error.
        - `XLSX_TO_CSV`: XLSX file could not be read or converted to CSV
        - `INVALID_CONTENT_TYPE`: uploaded file is neither CSV nor XLSX
        - `INVALID_HEADER_NAME`: CSV header row does not match any known resource type
        - `REQUIRED_FIELD_EMPTY`: a required field in the specified CSV row is empty
        - `INVALID_FIELD_VALUE`: a field value fails validation (e.g. non-numeric where numeric expected, unrecognized enum value)
        - `INVALID_JSON`: json field (extra_daten) syntactically incorrect
        - `UNIQUE`: row violates a database unique constraint
        - `INVALID_REFERENCE`: foreign key reference not found (e.g. degree program name in a study group CSV does not exist)
        - `CHECK`: database check constraint violation
        - `OTHER`: any other database or parsing error
      enum:
        - XLSX_TO_CSV
        - INVALID_CONTENT_TYPE
        - INVALID_HEADER_NAME
        - REQUIRED_FIELD_EMPTY
        - INVALID_FIELD_VALUE
        - INVALID_JSON
        - UNIQUE
        - INVALID_REFERENCE
        - CHECK
        - OTHER
      examples: ["REQUIRED_FIELD_EMPTY"]

    CSVResourceType:
      type: string
      description: A resource type that can be exported or imported via CSV.
      enum:
        - lecturer
        - room
        - degree_program
        - study_group
        - course
      examples: ["lecturer"]

    # ─── Shared / Enum Types ──────────────────────────────────────────────
    SemesterSeason:
      type: string
      description: The semester season
      enum:
        - winter
        - summer
      examples: ["winter"]

    LecturerKind:
      type: string
      description: |
        Category of a lecturer.
      enum:
        - regular
        - lab_engineer
        - adjunct_professor
      examples: ["regular"]
