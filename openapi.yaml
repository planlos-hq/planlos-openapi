openapi: 3.1.0
info:
  title: PlanLos API
  description: |
    API-Spezifikation von PlanLos, dem Open-Source-Wochenplaner für Hochschulen

    **Hinweis PUT Endpunkte**: Akzeptieren auch partielle Updates (PATCH Semantik)
  version: 1.0.0

servers:
  - url: /stundenplan/backend/api/v1/
    description: Deployment (same host as the docs)
  - url: http://localhost:8004/api/v1/
    description: Local

tags:
  - name: Room
    description: Manage rooms
  - name: Lecturer
    description: Manage lecturers and teaching staff
  - name: Course
    description: Manage courses
  - name: DegreeProgram
    description: Manage degree programs (Studiengänge)
  - name: StudyGroup
    description: Manage study groups
  - name: StudyGroupTemplate
    description: Manage study group templates
  - name: StudyGroupTemplateCourse
    description: Assign courses to study group templates (many-to-many)
  - name: CourseTimeSlot
    description: Manage scheduled time slots for courses
  - name: CourseColor
    description: Manage color definitions
  - name: CourseColorAssignment
    description: Assign colors to courses (many-to-many)
  - name: CourseLecturer
    description: Assign lecturers to courses (many-to-many)
  - name: CourseStudyGroup
    description: Assign study groups to courses (many-to-many)
  - name: TimeSlotRoomAssignment
    description: Assign rooms to course time slots (many-to-many)
  - name: LecturerNegativeTimeConstraint
    description: Manage time slots when a lecturer is NOT available
  - name: GlobalGalaktisch
    description: Fetch all resources in a single request
  - name: ResourceConflict
    description: Detect scheduling conflicts where a room, lecturer, or study group is double-booked in overlapping time slots
  - name: LecturerTimeConstraintViolation
    description: Detect cases where a lecturer is scheduled during a time they marked as unavailable
  - name: ImportExport
    description: Export and import the full database state as a binary dump

paths:
  # ─── Room ───────────────────────────────────────────────────────────────
  /room:
    get:
      tags: [Room]
      operationId: listRooms
      summary: List all rooms
      description: Returns an array of all rooms. Returns an empty array if no rooms exist.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "500":
          description: Internal server error
    post:
      tags: [Room]
      operationId: createRoom
      summary: Create a new room
      description: Creates a new room. The `number` field is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreate"
      responses:
        "201":
          description: Room created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid request body or missing required fields
        "415":
          description: Unsupported media type (Content-Type must be application/json)
        "500":
          description: Internal server error

  /room/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Room]
      operationId: getRoom
      summary: Get a room by ID
      description: Returns a single room by its ID.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Room not found or invalid ID
        "500":
          description: Internal server error
    put:
      tags: [Room]
      operationId: updateRoom
      summary: Update a room
      description: |
        Updates a room by ID. Uses PATCH semantics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/RoomUpdate"
                - type: "null"
      responses:
        "200":
          description: Room updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid request body
        "404":
          description: Invalid ID format
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error
    delete:
      tags: [Room]
      operationId: deleteRoom
      summary: Delete a room
      description: Deletes a room by ID.
      responses:
        "200":
          description: Room deleted successfully
        "404":
          description: Room not found or invalid ID
        "500":
          description: Internal server error

  # ─── Lecturer ───────────────────────────────────────────────────────────
  /lecturer:
    get:
      tags: [Lecturer]
      operationId: listLecturers
      summary: List all lecturers
      description: Returns an array of all lecturers. Returns an empty array if none exist.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lecturer"
        "500":
          description: Internal server error
    post:
      tags: [Lecturer]
      operationId: createLecturer
      summary: Create a new lecturer
      description: |
        Creates a new lecturer. The fields `first_name`, `last_name`, and `abbreviation` are required.
        If `is_relevant` is not provided, it defaults to `true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LecturerCreate"
      responses:
        "201":
          description: Lecturer created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lecturer"
        "400":
          description: Invalid request body or missing required fields
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error

  /lecturer/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Lecturer]
      operationId: getLecturer
      summary: Get a lecturer by ID
      description: Returns a single lecturer by their ID.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lecturer"
        "404":
          description: Lecturer not found or invalid ID
        "500":
          description: Internal server error
    put:
      tags: [Lecturer]
      operationId: updateLecturer
      summary: Update a lecturer
      description: |
        Updates a lecturer by ID. Uses PATCH semantics — only provided fields are updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/LecturerUpdate"
                - type: "null"
      responses:
        "200":
          description: Lecturer updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lecturer"
        "400":
          description: Invalid request body
        "404":
          description: Invalid ID format
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error
    delete:
      tags: [Lecturer]
      operationId: deleteLecturer
      summary: Delete a lecturer
      description: Deletes a lecturer by ID.
      responses:
        "200":
          description: Lecturer deleted successfully
        "404":
          description: Lecturer not found or invalid ID
        "500":
          description: Internal server error

  # ─── Course ─────────────────────────────────────────────────────────────
  /course:
    get:
      tags: [Course]
      operationId: listCourses
      summary: List all courses
      description: Returns an array of all courses. Returns an empty array if no courses exist.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "500":
          description: Internal server error
    post:
      tags: [Course]
      operationId: createCourse
      summary: Create a new course
      description: |
        Creates a new course. The fields `number`, `name`, and `abbreviation` are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreate"
      responses:
        "201":
          description: Course created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid request body or missing required fields
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error

  /course/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Course]
      operationId: getCourse
      summary: Get a course by ID
      description: Returns a single course by its ID.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          description: Course not found or invalid ID
        "500":
          description: Internal server error
    put:
      tags: [Course]
      operationId: updateCourse
      summary: Update a course
      description: |
        Updates a course by ID. Uses PATCH semantics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CourseUpdate"
                - type: "null"
      responses:
        "200":
          description: Course updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid request body
        "404":
          description: Invalid ID format
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error
    delete:
      tags: [Course]
      operationId: deleteCourse
      summary: Delete a course
      description: Deletes a course by ID.
      responses:
        "200":
          description: Course deleted successfully
        "404":
          description: Course not found or invalid ID
        "500":
          description: Internal server error

  # ─── Degree Program ─────────────────────────────────────────────────────
  /degree-program:
    get:
      tags: [DegreeProgram]
      operationId: listDegreePrograms
      summary: List all degree programs
      description: Returns an array of all degree programs. Returns an empty array if none exist.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DegreeProgram"
        "500":
          description: Internal server error
    post:
      tags: [DegreeProgram]
      operationId: createDegreeProgram
      summary: Create a new degree program
      description: |
        Creates a new degree program. Both `name` and `abbreviation` are required.
        Returns 409 Conflict if a degree program with the same name already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DegreeProgramCreate"
      responses:
        "201":
          description: Degree program created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeProgram"
        "400":
          description: Invalid request body or missing required fields
        "409":
          description: Degree program name already exists (unique constraint violation)
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error

  /degree-program/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [DegreeProgram]
      operationId: getDegreeProgram
      summary: Get a degree program by ID
      description: Returns a single degree program by its ID.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeProgram"
        "404":
          description: Degree program not found or invalid ID
        "500":
          description: Internal server error
    put:
      tags: [DegreeProgram]
      operationId: updateDegreeProgram
      summary: Update a degree program
      description: |
        Updates a degree program by ID. Uses PATCH semantics — only provided fields are updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/DegreeProgramUpdate"
                - type: "null"
      responses:
        "200":
          description: Degree program updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeProgram"
        "400":
          description: Invalid request body
        "404":
          description: Invalid ID format
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error
    delete:
      tags: [DegreeProgram]
      operationId: deleteDegreeProgram
      summary: Delete a degree program
      description: Deletes a degree program by ID.
      responses:
        "200":
          description: Degree program deleted successfully
        "404":
          description: Degree program not found or invalid ID
        "500":
          description: Internal server error

  # ─── Study Group ────────────────────────────────────────────────────────
  /study-group:
    get:
      tags: [StudyGroup]
      operationId: listStudyGroups
      summary: List all study groups
      description: Returns an array of all study groups. Returns an empty array if none exist.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyGroup"
        "500":
          description: Internal server error
    post:
      tags: [StudyGroup]
      operationId: createStudyGroup
      summary: Create a new study group
      description: |
        Creates a new study group. All fields but the templates field are required.
        The `semester_season` must be either `"winter"` or `"summer"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyGroupCreate"
      responses:
        "201":
          description: Study group created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroup"
        "400":
          description: Invalid request body, missing required fields, or invalid semester_season
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error

  /study-group/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [StudyGroup]
      operationId: getStudyGroup
      summary: Get a study group by ID
      description: Returns a single study group by its ID.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroup"
        "404":
          description: Study group not found or invalid ID
        "500":
          description: Internal server error
    put:
      tags: [StudyGroup]
      operationId: updateStudyGroup
      summary: Update a study group
      description: |
        Updates a study group by ID. Uses PATCH semantics.
        If `semester_season` is provided, it must be either `"winter"` or `"summer"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/StudyGroupUpdate"
                - type: "null"
      responses:
        "200":
          description: Study group updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroup"
        "400":
          description: Invalid request body or invalid semester_season
        "404":
          description: Invalid ID format
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error
    delete:
      tags: [StudyGroup]
      operationId: deleteStudyGroup
      summary: Delete a study group
      description: Deletes a study group by ID.
      responses:
        "200":
          description: Study group deleted successfully
        "404":
          description: Study group not found or invalid ID
        "500":
          description: Internal server error

  # ─── Study Group Template ───────────────────────────────────────────────
  /study-group-template:
    get:
      tags: [StudyGroupTemplate]
      operationId: listStudyGroupTemplates
      summary: List all study group templates
      description: Returns an array of all study group templates. Returns an empty array if none exist.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyGroupTemplate"
        "500":
          description: Internal server error
    post:
      tags: [StudyGroupTemplate]
      operationId: createStudyGroupTemplate
      summary: Create a new study group template
      description: |
        Creates a new study group template. All fields are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyGroupTemplateCreate"
      responses:
        "201":
          description: Study group template created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupTemplate"
        "400":
          description: Invalid request body or missing required fields
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error

  /study-group-template/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [StudyGroupTemplate]
      operationId: getStudyGroupTemplate
      summary: Get a study group template by ID
      description: Returns a single study group template by its ID.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupTemplate"
        "404":
          description: Study group template not found or invalid ID
        "500":
          description: Internal server error
    put:
      tags: [StudyGroupTemplate]
      operationId: updateStudyGroupTemplate
      summary: Update a study group template
      description: |
        Updates a study group template by ID. Uses PATCH semantics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/StudyGroupTemplateUpdate"
                - type: "null"
      responses:
        "200":
          description: Study group template updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupTemplate"
        "400":
          description: Invalid request body
        "404":
          description: Invalid ID format
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error
    delete:
      tags: [StudyGroupTemplate]
      operationId: deleteStudyGroupTemplate
      summary: Delete a study group template
      description: Deletes a study group template by ID.
      responses:
        "200":
          description: Study group template deleted successfully
        "404":
          description: Study group template not found or invalid ID
        "500":
          description: Internal server error

  # ─── Study Group Template Course (many-to-many) ──────────────────────────────────
  /study-group-template/{template_id}/courses:
    parameters:
      - $ref: "#/components/parameters/StudyGroupTemplateId"
    get:
      tags: [StudyGroupTemplateCourse]
      operationId: getStudyGroupTemplateCourses
      summary: List courses assigned to a study group template
      description: |
        Returns all courses assigned to the specified study group template.
        Returns 404 if the template does not exist.
        Returns an empty array if no courses are assigned.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "404":
          description: Invalid study group template ID format
        "500":
          description: Internal server error

  /study-group-template/{template_id}/course/{course_id}:
    parameters:
      - $ref: "#/components/parameters/StudyGroupTemplateId"
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [StudyGroupTemplateCourse]
      operationId: assignCourseToStudyGroupTemplate
      summary: Assign a course to a study group template
      description: |
        Creates an assignment between a course and a study group template.
        Both the course and study group template must exist. Returns 409 if the assignment already exists.
      responses:
        "201":
          description: Course assigned to study group template successfully
        "404":
          description: Course or study group template not found
        "409":
          description: Assignment already exists (unique constraint violation)
        "500":
          description: Internal server error
    delete:
      tags: [StudyGroupTemplateCourse]
      operationId: removeCourseFromStudyGroupTemplate
      summary: Remove a course from a study group template
      description: Removes the assignment between a course and a study group template.
      responses:
        "200":
          description: Assignment removed successfully
        "404":
          description: Assignment not found or invalid ID format
        "500":
          description: Internal server error

  # ─── Course Time Slot ───────────────────────────────────────────────────
  /course-time-slot:
    get:
      tags: [CourseTimeSlot]
      operationId: listCourseTimeSlots
      summary: List all course time slots
      description: Returns an array of all course time slots. Returns an empty array if none exist.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseTimeSlot"
        "500":
          description: Internal server error
    post:
      tags: [CourseTimeSlot]
      operationId: createCourseTimeSlot
      summary: Create a new course time slot
      description: |
        Creates a new time slot for a course. All fields are required.
        The `weekday` must be between 0 (Sunday) and 6 (Saturday).
        The referenced `course` must exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseTimeSlotCreate"
      responses:
        "201":
          description: Course time slot created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTimeSlot"
        "400":
          description: |
            Invalid request body, missing required fields, invalid weekday,
            or referenced course does not exist
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error

  /course-time-slot/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [CourseTimeSlot]
      operationId: getCourseTimeSlot
      summary: Get a course time slot by ID
      description: Returns a single course time slot by its ID.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTimeSlot"
        "404":
          description: Course time slot not found or invalid ID
        "500":
          description: Internal server error
    put:
      tags: [CourseTimeSlot]
      operationId: updateCourseTimeSlot
      summary: Update a course time slot
      description: |
        Updates a course time slot by ID. Uses PATCH semantics.
        If `weekday` is provided, it must be between 0 and 6.
        If `course` is provided, the referenced course must exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CourseTimeSlotUpdate"
                - type: "null"
      responses:
        "200":
          description: Course time slot updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTimeSlot"
        "400":
          description: Invalid request body, invalid weekday
        "404":
          description: Invalid ID format or referenced course does not exist
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error
    delete:
      tags: [CourseTimeSlot]
      operationId: deleteCourseTimeSlot
      summary: Delete a course time slot
      description: Deletes a course time slot by ID.
      responses:
        "200":
          description: Course time slot deleted successfully
        "404":
          description: Course time slot not found or invalid ID
        "500":
          description: Internal server error

  # ─── Course Color ───────────────────────────────────────────────────────
  /course-color:
    get:
      tags: [CourseColor]
      operationId: listCourseColors
      summary: List all course colors
      description: Returns an array of all course color definitions. Returns an empty array if none exist.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseColor"
        "500":
          description: Internal server error
    post:
      tags: [CourseColor]
      operationId: createCourseColor
      summary: Create a new course color
      description: |
        Creates a new course color definition. Both `name` and `hex` are required.
        The `hex` value must match the pattern `#RRGGBB` (e.g. `#FF5733`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseColorCreate"
      responses:
        "201":
          description: Course color created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseColor"
        "400":
          description: Invalid request body, missing required fields, or invalid hex format
        "415":
          description: Unsupported media type
        "500":
          description: Internal server error

  /course-color/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [CourseColor]
      operationId: getCourseColor
      summary: Get a course color by ID
      description: Returns a single course color by its ID.
      responses:
        "200":
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseColor"
        "404":
          description: Course color not found or invalid ID
        "500":
          description: Internal server error
    put:
      tags: [CourseColor]
      operationId: updateCourseColor
      summary: Update a course color
      description: |
        Updates a course color by ID. Uses PATCH semantics.
        If `hex` is provided, it must match the pattern `#RRGGBB`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CourseColorUpdate"
                - type: "null"
      responses:
        "200":
          description: Course color updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseColor"
        "400":
          description: Invalid request body or invalid hex format
        "404":
          description: Invalid ID format TODO 404 for non existing IDs
        "415":
